apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP_NAME}-data
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${STORAGE_SIZE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${APP_NAME}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: ${APP_NAME}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ${APP_NAME}
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8765"
            - name: BASE_PATH
              value: "${BASE_PATH}"
            - name: DATA_DIR
              value: "/app/data"
            - name: SYNC_INTERVAL_SECONDS
              value: "${SYNC_INTERVAL_SECONDS}"
            - name: SYNC_LOOKBACK_HOURS
              value: "${SYNC_LOOKBACK_HOURS}"
            - name: ECARGO_APPROVAL_DATE_FIELDS
              value: "approval_time,approved_time,approve_time,approval_date,approved_date"
            - name: ECARGO_222_USER
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: ECARGO_222_USER
            - name: ECARGO_222_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: ECARGO_222_PASSWORD
            - name: MS_GRAPH_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: MS_GRAPH_TENANT_ID
                  optional: true
            - name: MS_GRAPH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: MS_GRAPH_CLIENT_ID
                  optional: true
            - name: MS_GRAPH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: MS_GRAPH_CLIENT_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: ${BASE_PATH}
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: ${BASE_PATH}
              port: 8765
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${APP_NAME}-data
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}
  namespace: ${NAMESPACE}
spec:
  selector:
    app: ${APP_NAME}
  ports:
    - name: http
      port: 80
      targetPort: 8765
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APP_NAME}
  namespace: ${NAMESPACE}
spec:
  ingressClassName: ${INGRESS_CLASS}
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: ${BASE_PATH}
            pathType: Prefix
            backend:
              service:
                name: ${APP_NAME}
                port:
                  number: 80
  tls:
    - hosts:
        - ${INGRESS_HOST}
      secretName: ${TLS_SECRET}
